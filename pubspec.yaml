name: evendly_app
description: "Evendly is a Flutter event discovery and digital ticketing application powered by Firebase, location services, and QR-based tickets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.6
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3

  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.2

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/images/music/
    - assets/images/education/
    - assets/images/film/
    - assets/images/sports/
    - assets/images/art/

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/images/logo_splash.png
  android: true
  ios: true

  android_12:
    color: "#0B0F1A"
    image: assets/images/logo_splash.png

